name: Release Standalone Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build Standalone Windows Executable
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name "Lunariz" --collect-all customtkinter --distpath "dist" --workpath "build" "lunariz/gui/app.py"

      - name: Package Release ZIP
        run: |
          Compress-Archive -Path dist/Lunariz/* -DestinationPath Lunariz-Windows-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Lunariz-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
